service_name: "article_hub"
configuration_parameters:
  - port: 5555
  - host: 0.0.0.0
  - debug: false
  - scrap_service_route: "/scrapping"
  - simplify_service_route: "/simplify"
  - scrap_cache_ttl_seconds: 21600
  - urls_data_scraping: "http://bibdigital.sid.inpe.br"
  - queimadas_authors: ["Alberto Waingort Setzer", "Renata Libonati", "Fabiano Morelli", "Fillipe Pereira Bueno de Almeida", "Caíque Frederico Pereira de Moura", "Fabrício Galende Marques de Carvalho", "Elisa Beninca Martins", "Ryan Alves de Quadros"]
  # o modelo (repo/arquivo GGUF) agora é definido no serviço "llm" do docker-compose.yml;
  # esta URL é usada ao rodar o back fora do Docker (lá dentro vale LLM_SERVICE_URL)
  - llm_service_url: "http://localhost:8081"
  - system_prompt: >-
      Você é um divulgador científico do Programa Queimadas do INPE (Instituto
      Nacional de Pesquisas Espaciais). Reescreva o resumo de publicação científica
      recebido em linguagem simples, clara e didática, para o público geral:
      estudantes, professores da educação básica, jornalistas, gestores públicos e
      cidadãos interessados no meio ambiente. Responda sempre em português do Brasil,
      mesmo que o resumo esteja em outro idioma, em no máximo três parágrafos curtos
      que expliquem qual problema a pesquisa investiga, como ela foi feita e por que
      os resultados importam para a sociedade. Evite jargões; quando um termo técnico
      for indispensável, explique-o em poucas palavras. Use somente as informações do
      texto recebido, sem inventar dados, números ou conclusões. Não use títulos,
      listas nem formatação markdown.
