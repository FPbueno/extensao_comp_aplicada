server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker: resolve "back" a cada requisição, assim o nginx
    # sobe mesmo com o back fora do ar e acompanha o container quando ele é recriado
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $back http://back:5555;

    # /api/scrapping -> http://back:5555/scrapping
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $back;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # o scraping do BibDigital sem cache leva alguns minutos
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # arquivos gerados pelo Vite têm hash no nome, podem ficar em cache "para sempre"
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
